name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore VAL.sln --locked-mode

      - name: Verify formatting
        run: dotnet format VAL.sln --no-restore --verify-no-changes

      - name: Build solution
        run: dotnet build VAL.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test MAIN/VAL.Tests/VAL.Tests.csproj -c Release --no-build --no-restore

      - name: Validate client scripts
        run: node Build/Verify_ClientScripts.js

      - name: Validate release scripts and compatibility probe
        shell: pwsh
        run: |
          ./Build/Verify_BuildScripts.ps1
          dotnet restore Build/UpgradeProbe/UpgradeProbe.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Build/UpgradeProbe/UpgradeProbe.csproj -c Release --no-restore

      - name: Audit dependencies
        shell: pwsh
        run: ./Build/Verify_Dependencies.ps1

      - name: Verify source manifest
        shell: pwsh
        run: |
          ./Update-Manifest.ps1
          git diff --exit-code -- MAIN/Manifest.txt

      - name: Publish desktop application
        shell: pwsh
        run: ./Build/Publish_Release.ps1 -ValidationOutputRoot artifacts/ci

      - name: Validate published startup and deferred cleanup
        shell: pwsh
        run: ./Build/Verify_PublishedRelease.ps1 -ValidationOutputRoot artifacts/ci

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: VAL-win-x64
          path: artifacts/ci
          if-no-files-found: error
          retention-days: 14
